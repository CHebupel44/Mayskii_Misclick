<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../javascript/auth.js" defer></script>
    <script src="../javascript/login.js" defer></script>
</head>
<body class="login-page">
    <a class="auth-back" href="index.html">← Назад</a>

    <main class="login">
        <h1 id="auth-title">Авторизация</h1>

        <div id="login-step">
            <nav class="auth-tabs" aria-label="Способ входа">
                <span>По:</span>
                <button type="button" class="active"
                        data-method="password" aria-pressed="true">
                    Паролю
                </button>
                <button type="button"
                        data-method="phone" aria-pressed="false">
                    Телефону
                </button>
            </nav>

            <form id="login-form">
                <div id="password-fields">
                    <label for="login">Логин</label>
                    <input id="login" autocomplete="username" required>

                    <label for="password">Пароль</label>
                    <input id="password" type="password"
                           autocomplete="current-password" required>

                           <a class="forgot" href="recovery.html">Забыли пароль?</a>
                </div>

                <div id="phone-fields" hidden>
                    <label for="phone">Номер телефона</label>
                    <input id="phone" type="tel" autocomplete="tel"
                           pattern="\+?[0-9 ()-]{10,20}"
                           title="Введите номер телефона"
                           required disabled>

                    <p class="auth-hint">
                        (код 123456)
                    </p>
                </div>

                <div class="other-login">
                    <p>Войти другим способом:</p>

                    <div class="login-methods">
                        <button type="button">ВК</button>
                        <button type="button">G</button>
                        <button type="button">Я</button>
                        <button type="button">ТГ</button>
                        <button type="button">@</button>
                    </div>
                </div>

                <p id="login-message" role="status"></p>

                <button class="login-submit" id="login-submit" type="submit">
                    Войти
                </button>

                <p class="auth-switch">
                    Ещё не зарегистрированы?
                    <a href="register.html">Зарегистрироваться</a>
                </p>
            </form>
        </div>

        <form id="code-form" hidden>
            <p class="code-description">
                Введите код из 6 цифр:
                <strong>123456</strong>
            </p>

            <div class="code-inputs">
                <input aria-label="Цифра 1" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
                <input aria-label="Цифра 2" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
                <input aria-label="Цифра 3" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
                <input aria-label="Цифра 4" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
                <input aria-label="Цифра 5" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
                <input aria-label="Цифра 6" inputmode="numeric" pattern="[0-9]" maxlength="1" required disabled>
            </div>

            <button class="forgot" id="resend-code" type="button">
                Не приходит код?
            </button>

            <p id="code-message" role="status"></p>

            <button class="login-submit" type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
