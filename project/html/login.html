<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../javascript/login.js" defer></script>
</head>
<body class="login-page">
    <main class="login">
        <h1>Авторизация</h1>

        <form id="login-form">
            <label for="login">Логин</label>
            <input id="login" autocomplete="username" required>

            <label for="password">Пароль</label>
            <input id="password" type="password"
                   autocomplete="current-password" required>

            <button class="forgot" type="button">
                Забыли пароль?
            </button>

            <div class="other-login">
                <p>Войти другим способом:</p>

                <div class="login-methods">
                    <button type="button">ВК</button>
                    <button type="button">G</button>
                    <button type="button">Я</button>
                    <button type="button">ТГ</button>
                    <button type="button">@</button>
                </div>
            </div>

            <p id="login-message" role="status"></p>

            <button class="login-submit" type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
